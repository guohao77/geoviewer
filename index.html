<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GeoVista — GIS Shapefile Viewer</title>
  <meta name="description" content="A powerful, stylish browser-based GIS viewer for ESRI Shapefiles. Open polygons, lines, and points with full layer management — no server required." />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- App Styles -->
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/layers.css" />
</head>
<body>

  <!-- ===== TOPBAR ===== -->
  <header class="topbar" id="topbar">
    <div class="topbar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="url(#brandGrad)"/>
          <circle cx="12" cy="9" r="2.5" fill="white" opacity="0.9"/>
          <defs>
            <linearGradient id="brandGrad" x1="5" y1="2" x2="19" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="brand-name">GeoVista</span>
      <span class="brand-tag">GIS Viewer</span>
    </div>

    <div class="topbar-actions">
      <!-- File Open -->
      <button class="btn btn-primary" id="btn-open-file" title="Open Shapefile">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/></svg>
        Open File
      </button>
      <input type="file" id="file-input" accept=".zip,.shp,.dbf,.prj,.shx" multiple hidden />
      <button class="btn btn-ghost project-action" id="btn-save-project" title="Save project">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 2h12l3 3v13H2V2h1zm2 2v4h8V4H5zm0 7v5h10v-5H5z"/></svg>
        Save Project
      </button>
      <button class="btn btn-ghost project-action" id="btn-load-project" title="Load project">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 3h10v4h4v10H3V3zm2 2v10h10V9h-4V5H5zm5 1v4H7l3 3 3-3h-3V6z"/></svg>
        Load Project
      </button>
      <input type="file" id="project-file-input" accept=".json,.geovista" hidden />

      <!-- Basemap Switcher -->
      <div class="dropdown" id="basemap-dropdown">
        <button class="btn btn-ghost" id="btn-basemap">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12 1.586l-4 4v12.828l4-4V1.586zM3.707 3.293A1 1 0 002 4v10a1 1 0 00.293.707L6 18.414V5.586L3.707 3.293zM17.707 5.293L14 1.586v12.828l2.293 2.293A1 1 0 0018 16V6a1 1 0 00-.293-.707z" clip-rule="evenodd"/></svg>
          Basemap
          <svg class="dropdown-caret" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
        <div class="dropdown-menu" id="basemap-menu">
          <button class="dropdown-item active" data-basemap="dark">Dark Matter</button>
          <button class="dropdown-item" data-basemap="light">CartoDB Positron</button>
          <button class="dropdown-item" data-basemap="osm">OpenStreetMap</button>
          <button class="dropdown-item" data-basemap="satellite">ESRI Satellite</button>
          <button class="dropdown-item" data-basemap="topo">ESRI Topo</button>
        </div>
      </div>

      <!-- Tools Dropdown -->
      <div class="dropdown" id="tools-dropdown">
        <button class="btn btn-ghost" id="btn-tools">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
          Tools
          <svg class="dropdown-caret" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
        <div class="dropdown-menu" id="tools-menu">
          <button class="dropdown-item" id="tool-measure-distance">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 3a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2V5a2 2 0 00-2-2H5zm0 2h10v10H5V5z" clip-rule="evenodd"/></svg>
            Measure Distance
          </button>
          <button class="dropdown-item" id="tool-measure-area">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/></svg>
            Measure Area
          </button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item danger" id="tool-clear-all">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
            Clear All Layers
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <div class="app-layout">

    <!-- ===== SIDEBAR / LAYER TREE ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM14 11a1 1 0 011 1v1h1a1 1 0 110 2h-1v1a1 1 0 11-2 0v-1h-1a1 1 0 110-2h1v-1a1 1 0 011-1z"/></svg>
          Layers
        </span>
        <button class="sidebar-add-btn" id="btn-add-layer" title="Add layer">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
        </button>
      </div>

      <!-- Layer Tree -->
      <div class="layer-tree" id="layer-tree">
        <!-- Empty state -->
        <div class="layer-empty-state" id="layer-empty-state">
          <div class="empty-icon">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="8" y="20" width="48" height="36" rx="4" fill="url(#emptyGrad)" opacity="0.3"/>
              <path d="M8 24l24-16 24 16" stroke="url(#emptyGrad)" stroke-width="2" stroke-linejoin="round"/>
              <circle cx="32" cy="38" r="6" fill="url(#emptyGrad)" opacity="0.6"/>
              <path d="M29 38h6M32 35v6" stroke="white" stroke-width="2" stroke-linecap="round"/>
              <defs>
                <linearGradient id="emptyGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#3b82f6"/>
                  <stop offset="1" stop-color="#8b5cf6"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <p class="empty-title">No layers yet</p>
          <p class="empty-hint">Drop a .zip shapefile here or use <strong>Open File</strong></p>
          <div class="empty-drop-zone" id="empty-drop-zone">
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
            Drop shapefile here
          </div>
        </div>

        <!-- Layer items render here -->
        <ul class="layer-list" id="layer-list"></ul>
      </div>

      <!-- Sidebar footer: zoom extent -->
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-sm full-width" id="btn-zoom-all">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 8a1 1 0 011-1h1V6a1 1 0 012 0v1h1a1 1 0 110 2H9v1a1 1 0 11-2 0V9H6a1 1 0 01-1-1zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"/></svg>
          Zoom to All Layers
        </button>
      </div>
    </aside>

    <!-- ===== MAP CANVAS ===== -->
    <main class="map-container" id="map-container">
      <!-- Leaflet Map -->
      <div id="map"></div>

      <!-- Drag & Drop Overlay -->
      <div class="drop-overlay" id="drop-overlay">
        <div class="drop-overlay-inner">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 4L44 24L24 44L4 24L24 4Z" stroke="url(#dropGrad)" stroke-width="2"/>
            <path d="M24 16v16M16 24h16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            <defs>
              <linearGradient id="dropGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
                <stop stop-color="#3b82f6"/>
                <stop offset="1" stop-color="#8b5cf6"/>
              </linearGradient>
            </defs>
          </svg>
          <p>Drop shapefile to load</p>
          <small>.zip, .shp + .dbf, or multiple files</small>
        </div>
      </div>

      <!-- Map Toolbar (floating) -->
      <div class="map-toolbar" id="map-toolbar">
        <button class="map-tool-btn" id="btn-zoom-in" title="Zoom In">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
        </button>
        <button class="map-tool-btn" id="btn-zoom-out" title="Zoom Out">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
        </button>
        <div class="map-tool-divider"></div>
        <button class="map-tool-btn" id="btn-zoom-extent" title="Zoom to Extent">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h4a1 1 0 010 2H6.414l2.293 2.293a1 1 0 11-1.414 1.414L5 6.414V8a1 1 0 01-2 0V4zm9 1a1 1 0 010-2h4a1 1 0 011 1v4a1 1 0 01-2 0V6.414l-2.293 2.293a1 1 0 11-1.414-1.414L13.586 5H12zm-9 7a1 1 0 012 0v1.586l2.293-2.293a1 1 0 111.414 1.414L6.414 15H8a1 1 0 010 2H4a1 1 0 01-1-1v-4zm13-1a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 010-2h1.586l-2.293-2.293a1 1 0 111.414-1.414L15 13.586V12a1 1 0 011-1z" clip-rule="evenodd"/></svg>
        </button>
      </div>

      <!-- Measure result display -->
      <div class="measure-result" id="measure-result" style="display:none;">
        <span id="measure-value">—</span>
        <button class="measure-close" id="measure-close">✕</button>
      </div>
    </main>

    <!-- ===== ATTRIBUTE INSPECTOR PANEL ===== -->
    <aside class="inspector-panel" id="inspector-panel">
      <div class="inspector-header">
        <span class="inspector-title">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
          Feature Properties
        </span>
        <button class="inspector-close" id="inspector-close">
          <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>
      <div class="inspector-layer-badge" id="inspector-layer-badge"></div>
      <div class="inspector-body" id="inspector-body">
        <table class="attr-table" id="attr-table">
          <tbody id="attr-tbody"></tbody>
        </table>
      </div>
    </aside>
  </div>

  <!-- ===== STATUS BAR ===== -->
  <footer class="statusbar" id="statusbar">
    <div class="status-item">
      <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="8" r="3"/></svg>
      <span id="status-coords">—, —</span>
    </div>
    <div class="status-separator"></div>
    <div class="status-item">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zM2 8a6 6 0 1112 0A6 6 0 012 8z"/><path d="M4 8a4 4 0 118 0A4 4 0 014 8zm4-1a1 1 0 100 2 1 1 0 000-2z"/></svg>
      Zoom: <span id="status-zoom">—</span>
    </div>
    <div class="status-separator"></div>
    <div class="status-item">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M14 10H2v4h12v-4zM2 2v2h4v4h4V4h4V2H2z"/></svg>
      <span id="status-layers">0 layers</span>
    </div>
    <div class="status-separator"></div>
    <div class="status-item" id="status-crs">
      CRS: <span id="status-crs-val">WGS84</span>
    </div>
    <div class="status-push"></div>
    <div class="status-item status-brand">
      <svg viewBox="0 0 16 16" fill="currentColor" style="color:#3b82f6"><path d="M8 2C5.24 2 3 4.24 3 7c0 3.5 5 9 5 9s5-5.5 5-9c0-2.76-2.24-5-5-5z"/></svg>
      GeoVista v1.0
    </div>
  </footer>

  <!-- ===== TOAST NOTIFICATIONS ===== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ===== LOADING SPINNER ===== -->
  <div class="loader-overlay" id="loader-overlay" style="display:none;">
    <div class="loader-box">
      <div class="loader-spinner"></div>
      <p id="loader-text">Loading shapefile…</p>
    </div>
  </div>

  <!-- ===== CDN LIBRARIES ===== -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://unpkg.com/shapefile@0.6.6/dist/shapefile.js"></script>
  <script src="https://unpkg.com/proj4@2.9.0/dist/proj4.js"></script>

  <!-- App Scripts (order matters) -->
  <script src="js/symbology.js"></script>
  <script src="js/layer-manager.js"></script>
  <script src="js/attribute-inspector.js"></script>
  <script src="js/shapefile-loader.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
